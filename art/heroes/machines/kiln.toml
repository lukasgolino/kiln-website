# The machine showpieces of the KILN site: a narrow-gauge steam locomotive and a deep-sea diver, built as
# high-detail hard-surface glbs for the browser.
default_style = "foundry"      # styles/foundry.style.toml (extends the soft_toy preset)
default_palette = "workshop"   # palettes/workshop.pal.yaml
output_dir = "build"
preview_dir = "previews"
preview_size = 480
export = ["glb"]               # three.js loads the glb with the standard glTF material: no engine scenes
style_version = 1

[lint]
disable = []
